name: Build

on:
  push:

jobs:
  Build:
    name: "Build JDK ${{ matrix.java-version }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [25]
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "${{ matrix.java-version }}"
          distribution: "temurin"
          cache: maven
      - name: Build with Maven
        run: ./mvnw verify
